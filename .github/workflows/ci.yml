name: CI — search_engine_backend

on:
  push:
    branches: [staging, dev-Marlow, main]
  pull_request:
    branches: [dev-Marlow, main]

env:
  NEO4J_USERNAME: neo4j
  NEO4J_PASSWORD: testpassword
  NEO4J_HOST: localhost
  NEO4J_PORT: "7687"
  MONGO_DB_NAME: centinela_test
  MONGO_DB_USERNAME: admin
  DJANGO_SETTINGS_MODULE: config.settings
  MONGO_DB_PASSWORD: adminpass
  MONGO_DB_HOST: localhost
  MONGO_DB_PORT: "27017"
  DEBUG: "True"

jobs:
  # ── Unitarios ──────────────────────────────────────────────────────────────
  test-unit:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.18
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7474:7474", "7687:7687"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -q -r requirements.txt pytest pytest-django pytest-cov
      - name: Esperar arranque de Neo4j
        run: sleep 30
      - name: Ejecutar tests unitarios
        run: |
          pytest apps/search_engine/tests/ -v --tb=short \
            --junitxml=report-unit.xml \
            --cov=apps --cov-report=term --cov-report=xml:coverage-unit.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            report-unit.xml
            coverage-unit.xml

  # ── Integración ────────────────────────────────────────────────────────────
  test-integration:
    name: Pruebas de integración
    runs-on: ubuntu-latest
    needs: test-unit
    services:
      neo4j:
        image: neo4j:5.18
        env:
          NEO4J_AUTH: neo4j/testpassword
        ports: ["7474:7474", "7687:7687"]
        options: >-
          --health-cmd "wget -q --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 8
      mongo:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: adminpass
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -q -r requirements.txt pytest pytest-django pytest-cov
      - name: Esperar arranque de Neo4j y MongoDB
        run: sleep 35
      - name: Ejecutar tests de integración
        run: |
          pytest apps/ -v --tb=short -m integration \
            --junitxml=report-integration.xml \
            --cov=apps --cov-report=term --cov-report=xml:coverage-integration.xml
      - name: Subir resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            report-integration.xml
            coverage-integration.xml

  # ── Docker build ───────────────────────────────────────────────────────────
  build-docker:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: test-integration
    if: github.ref == 'refs/heads/dev-Marlow' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build imagen
        run: docker build -t search_engine_backend:${{ github.sha }} .
      - name: Verificar imagen
        run: docker images search_engine_backend
